title: Confirmation protocol, frozen before any 2023-2025 outcome is evaluated
frozen_at_utc: '2026-10-20T02:28:12'
forecast_origins: 2023-01 to 2025-12 (test years 2023, 2024, 2025); 2021-2022 are warm-up folds that only supply history for
  the fallback rule
countries:
  core9:
  - BRA
  - CHN
  - HUN
  - IND
  - KOR
  - MEX
  - POL
  - RUS
  - ZAF
  external6:
  - TUR
  - IDN
  - THA
  - MYS
  - CHL
  - COL
features:
- reer_vol_hist_3m
- reer_vol_hist_6m
- reer_vol_hist_12m
- reer_ret_cum_3m
- cpi_yoy_lag1
- cpi_vol_rt
- fx_res_vol_rt
- fx_res_yoy_rt
- cg_gap_rt
- fin_depth_rt
- ln_gdp_pc_rt
- gdp_growth_rate_rt
- ln_pop_rt
- trade_openness_wb_rt
- fin_openness_proxy_rt
- unemp_rate_wb_rt
- policy_rate_diff_us
- usd_neer_ret_1m
- usd_neer_vol_3m
- iq_mean_rt
- iq_data_age_m
feature_note: 'FX-share (CI) features excluded: the CI export ends before 2023'
target: target_reer_vol_3m; high-risk if >= 80th percentile of the pooled training targets of the fold
folds:
- split_id: CONF_2021
  role: warmup
  train_start: 2012-01
  train_end_origin: 2019-08
  calib_start: 2020-01
  calib_end_origin: 2020-08
  test_start: 2021-01
  test_end: 2021-12
- split_id: CONF_2022
  role: warmup
  train_start: 2012-01
  train_end_origin: 2020-08
  calib_start: 2021-01
  calib_end_origin: 2021-08
  test_start: 2022-01
  test_end: 2022-12
- split_id: CONF_2023
  role: confirmation
  train_start: 2012-01
  train_end_origin: 2021-08
  calib_start: 2022-01
  calib_end_origin: 2022-08
  test_start: 2023-01
  test_end: 2023-12
- split_id: CONF_2024
  role: confirmation
  train_start: 2012-01
  train_end_origin: 2022-08
  calib_start: 2023-01
  calib_end_origin: 2023-08
  test_start: 2024-01
  test_end: 2024-12
- split_id: CONF_2025
  role: confirmation
  train_start: 2012-01
  train_end_origin: 2023-08
  calib_start: 2024-01
  calib_end_origin: 2024-08
  test_start: 2025-01
  test_end: 2025-12
maturity_rule: training and calibration origins satisfy origin + h + 1 < first test month (h = 3)
models:
- B0_Historical_Rule
- B1_Regularized_Linear
- M0_EBM_Additive (macro + IQ)
- B4_XGBoost
seeds:
- 42
- 1024
- 2024
- 3407
- 7777
probabilities: raw (the calibration scheme locked for B0, B1, B4, M0 in the main study)
decision_threshold:
  C_FN: 5
  C_FP: 1
  tau: 0.16666666666666666
review_budget_k_per_month: 2
fallback_policy:
  learned_model: M0_EBM_Additive
  learned_model_choice: 'highest development-fold mean AP among [''B1_Regularized_Linear'', ''B4_XGBoost'', ''M0_EBM_Additive'']
    with macro + IQ features: {''B1_Regularized_Linear'': 0.438, ''B4_XGBoost'': 0.4397, ''M0_EBM_Additive'': 0.4405}'
  rule: for test year T, compute AP gain over B0 and ECE of the learned model on the latest 12 matured origins (origins up
    to August of T-1); deploy the learned model only if gain >= delta and ECE <= cap, otherwise deploy B0
  delta: 0.02
  ece_cap: 0.11
  ece_cap_choice: maximum per-fold ECE of B0 on the development folds 2017-2020, rounded up to 0.01
  single_evaluation_on_retrospective_test:
  - test_year: 2021
    deployed: B0_Historical_Rule
    hist_AP_gain: 0.1346
    hist_ECE: 0.1612
    cost_C5_per100: !!python/object/apply:numpy.core.multiarray.scalar
    - &id001 !!python/object/apply:numpy.dtype
      args:
      - f8
      - false
      - true
      state: !!python/tuple
      - 3
      - <
      - null
      - null
      - null
      - -1
      - -1
      - 0
    - !!binary |
      TmIQWDm0PEA=
  - test_year: 2022
    deployed: B0_Historical_Rule
    hist_AP_gain: -0.0363
    hist_ECE: 0.0544
    cost_C5_per100: !!python/object/apply:numpy.core.multiarray.scalar
    - *id001
    - !!binary |
      JzEIrBzaSkA=
primary_comparisons:
- fallback policy vs B0 (cost C_FN=5)
- learned model vs B0 (AP, Brier, cost)
- every model vs never-alert
inference: paired moving-block bootstrap over months, L = 6, 1000 replications
reporting: all models, all years and both country groups are reported regardless of outcome
